  :root {
    color-scheme: dark;
    --void: #05070f; --wing: #0a0f20; --stage: #0e1630; --stage2: #16214a; --floor: #111a38;
    --steel: #263872; --steel-l: #5b72b8; --rig: #34457e; --haze: #a9bcef; --ink: #eef2ff; --ink-dim: #b4c0e2;
    --red: #b0003c; --red-hi: #c84d77; --red-dk: #460018; --red-glow: rgba(176, 0, 60, .6); --haze-glow: rgba(169, 188, 239, .35);
    --pixel: "Jersey 10", "Courier New", monospace;
    --pixel-fine: "Jersey 20", "Courier New", monospace;
    --text: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; border-radius: 0; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--void); color: var(--ink); }
  body { font: 17px/1.5 var(--text); -webkit-text-size-adjust: 100%;
         padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  .wrap { max-width: 30rem; margin: 0 auto; padding: 1.4rem 1rem 3rem; }
  .event { font-family: var(--pixel-fine); font-size: 1.35rem; line-height: 1; color: var(--ink-dim); margin: 0 0 .8rem; letter-spacing: .02em; }

  /* ---------------------------------------------------------------- neon tubes
     four straight segments with square ends and a gap at every corner */
  .tube { position: relative; --tc: var(--haze); --tg: var(--haze-glow); --t: 3px; --gap: 7px; }
  .tube::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(var(--tc), var(--tc)) var(--gap) 0    / calc(100% - 2 * var(--gap)) var(--t) no-repeat,
      linear-gradient(var(--tc), var(--tc)) var(--gap) 100% / calc(100% - 2 * var(--gap)) var(--t) no-repeat,
      linear-gradient(var(--tc), var(--tc)) 0    var(--gap) / var(--t) calc(100% - 2 * var(--gap)) no-repeat,
      linear-gradient(var(--tc), var(--tc)) 100% var(--gap) / var(--t) calc(100% - 2 * var(--gap)) no-repeat;
    filter: drop-shadow(0 0 1px var(--tg)) drop-shadow(0 0 5px var(--tg)); }
  .tube.hot { --tc: var(--red-hi); --tg: var(--red-glow); }
  .tube.ignite::after { animation: ignite .32s steps(1, end) both; }
  .tube.dim::after { animation: dim .62s steps(1, end) both; }
  @keyframes ignite { 0% { opacity: 0; } 19% { opacity: 1; } 41% { opacity: .2; } 94% { opacity: 1; } }
  @keyframes dim { 0% { opacity: 1; } 15% { opacity: .15; } 40% { opacity: .9; } 60% { opacity: .1; } 100% { opacity: 1; } }

  /* ---------------------------------------------------------------- the stage */
  .stage { position: relative; background: var(--wing); padding: 0 12px 10px; }
  .valance { height: 22px; background: var(--stage2); display: flex; align-items: center; justify-content: space-evenly; border-bottom: 2px solid var(--rig); }
  .bulb { width: 6px; height: 6px; background: #c9d5f7; opacity: .35; }
  .stage.busy .bulb { animation: chase .9s steps(1, end) infinite; }
  .stage.busy .bulb:nth-child(2) { animation-delay: .1s; } .stage.busy .bulb:nth-child(3) { animation-delay: .2s; }
  .stage.busy .bulb:nth-child(4) { animation-delay: .3s; } .stage.busy .bulb:nth-child(5) { animation-delay: .4s; }
  .stage.busy .bulb:nth-child(6) { animation-delay: .5s; } .stage.busy .bulb:nth-child(7) { animation-delay: .6s; }
  .stage.busy .bulb:nth-child(8) { animation-delay: .7s; } .stage.busy .bulb:nth-child(9) { animation-delay: .8s; }
  @keyframes chase { 0% { opacity: 1; background: #fff; } 22% { opacity: .35; background: #c9d5f7; } }
  .stage.ready .bulb { opacity: .9; }

  .opening { position: relative; height: clamp(15rem, 64vw, 19rem); overflow: hidden; background: var(--stage); }
  .boards { position: absolute; left: 0; right: 0; bottom: 0; height: 2.6rem; background: var(--floor); border-top: 2px solid var(--rig); }

  /* behind the curtain: the result */
  .behind { position: absolute; inset: 0 0 2.6rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .9rem; padding: 1rem; }
  .plate { display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--ink); background: var(--stage2); }
  a.plate { width: min(17rem, 100%); min-height: 4rem; font-family: var(--pixel); font-size: 2rem; line-height: 1; padding: .6rem 1rem; }
  a.plate:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  a.plate.small { min-height: 3.1rem; font-size: 1.6rem; background: var(--stage); }

  /* the curtain: pleats are rectangles */
  .curtain { position: absolute; inset: 0; z-index: 2;
    background: repeating-linear-gradient(90deg, #1c2a5c 0 18px, #16214a 18px 30px, #121b3d 30px 38px, #1a2756 38px 46px);
    transition: transform 1.15s cubic-bezier(.62, 0, .28, 1); }
  .curtain::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: #0d1532; }
  .stage.ready .curtain { transform: translateY(-101%); }
  .words { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 1.4rem; z-index: 2; }
  .words p { margin: 0; font-family: var(--pixel); font-size: clamp(2.4rem, 12vw, 3.4rem); line-height: .92; color: var(--ink); text-shadow: 0 2px 0 var(--void); }
  .words .soon { display: none; }
  .stage.cooking .words .idle { display: none; }
  .stage.cooking .words .soon { display: block; }
  .sign { display: inline-block; padding: .7rem 1rem .55rem; background: rgba(5, 7, 15, .72); }
  .sign b { display: block; font: 400 clamp(2.2rem, 11vw, 3rem)/.95 var(--pixel); }
  .sign span { display: block; margin-top: .45rem; font: 400 1.15rem/1.15 var(--pixel-fine); color: var(--ink); max-width: 17rem; }

  /* cooking: the work lights behind the cloth and the crew's shadows */
  .worklight { position: absolute; inset: 0; z-index: 1; opacity: 0; transition: opacity .6s steps(3, end);
    background: linear-gradient(0deg, rgba(110, 140, 230, .42) 0%, rgba(80, 110, 210, .2) 45%, rgba(40, 60, 140, 0) 85%); mix-blend-mode: screen; }
  .stage.cooking .worklight { opacity: 1; }
  .crew { position: absolute; bottom: 10px; left: 0; z-index: 1; opacity: 0; color: rgba(5, 7, 15, .55); }

  .stage.cooking .crew.b { animation-duration: 17s; animation-delay: -7s; bottom: 6px; transform: scale(1.25); }

  @keyframes stepB { 0% { height: 22px; } 50% { height: 27px; } }

  /* ---------------------------------------------------------------- the form */
  form { margin-top: 1.4rem; }
  .intro { margin: 0 0 1rem; color: var(--ink-dim); }
  .fields { display: grid; grid-template-columns: 6.2rem 1fr; gap: .9rem; }
  .field { display: flex; flex-direction: column; gap: .35rem; }
  .field > span { font: 400 1.2rem/1 var(--pixel-fine); color: var(--ink-dim); }
  .box { background: var(--stage); padding: 5px; }
  .box input { display: block; width: 100%; height: 4rem; border: 0; margin: 0; background: transparent; color: var(--ink);
               font: 400 2.7rem/1 var(--pixel); text-align: center; padding: .25rem 0 0; caret-color: var(--red-hi); }
  .box input::placeholder { color: #44558f; }
  #p { text-transform: uppercase; letter-spacing: .08em; font-size: 2.3rem; }
  .flap { position: relative; }
  .flap::before { content: ""; position: absolute; left: 5px; right: 5px; top: 50%; height: 2px; background: var(--void); z-index: 1; pointer-events: none; }
  .flap input.clack { animation: clack .2s steps(3, end); }
  @keyframes clack { 0% { transform: scaleY(1); } 33% { transform: scaleY(.15); } 66% { transform: scaleY(.6); } 100% { transform: scaleY(1); } }

  #msg { min-height: 1.5rem; margin: .9rem 0 0; color: var(--ink); }
  a.plate.waiting { margin: 1.1rem auto 0; }
  #msg:empty { margin: 0; min-height: 0; }
  button.go { display: block; width: 100%; margin-top: 1.4rem; min-height: 4rem; border: 0; cursor: pointer;
              background: var(--red-dk); color: #fff; font: 400 2rem/1 var(--pixel); padding: .55rem 1rem .4rem; }
  button.go[disabled] { cursor: progress; }
  .again { display: none; margin: 1.1rem auto 0; background: none; border: 0; color: var(--ink-dim); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: .4rem; }
  .done form { display: none; }
  .done .again { display: block; }

  footer { margin-top: 2.6rem; color: var(--ink-dim); font-size: .95rem; }
  footer p { margin: .25rem 0; }
  footer a { color: var(--ink); }

  @media (min-width: 40rem) { .wrap { padding-top: 3rem; } }
  @media (prefers-reduced-motion: reduce) {
    .tube.ignite::after, .tube.dim::after, .stage.busy .bulb, .stage.cooking .crew, .stage.cooking .crew i, .flap input.clack { animation: none !important; }
    .stage.cooking .crew.a { transform: translateX(3rem); } .stage.cooking .crew.b { transform: translateX(12rem) scale(1.25); }
    .curtain { transition-duration: .25s; }
  }

<script>
(function () {
  'use strict';
  const DATA = JSON.parse(document.getElementById('zt-data').textContent);
  const MAIL = ["eknah.dlarah", "moc.xonirotciv"];
  const $ = id => document.getElementById(id);
  const app = $('app'), stage = $('stage'), f = $('f'), n = $('n'), p = $('p'), msg = $('msg'), go = $('go');
  const enc = new TextEncoder();
  const STORE = 'zt26-karte';

  // contact address, assembled here so it is not plain text in the page
  const addr = MAIL.map(s => s.split('').reverse().join('')).join('@');
  $('mail').href = 'mailto:' + addr; $('mail').textContent = addr;
  $('release').textContent = RELEASE_TEXT;

  const canon = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const wait = ms => new Promise(r => setTimeout(r, ms));
  function say(text) { msg.textContent = text; }
  function flick(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  async function open(num, pw) {
    const d = DATA.cards[String(num)];
    if (!d) throw new Error('none');
    const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(d.s), iterations: DATA.kdf.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(d.i), additionalData: enc.encode(String(num)) }, key, b64(d.c));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function show(entry, num) {
    if (!entry.folder) { stage.classList.remove('cooking'); say('Zu Karte ' + num + ' gibt es keine Dateien. Schreib uns: ' + addr); return false; }
    if (MAKING_OF_URL) { $('making').href = MAKING_OF_URL; $('making').hidden = false; }
    app.classList.add('done');
    if (COOKING) {
      stage.classList.add('cooking'); flick($('sign'), 'ignite');
      say('Karte ' + num + ' ist richtig. Deine Dateien kommen bald.');
      if (MAKING_OF_URL) { $('making2').href = MAKING_OF_URL; $('making2').hidden = false; }
      return true;
    }
    $('files').href = entry.folder; $('files').hidden = false;
    stage.classList.add('ready'); flick($('files'), 'ignite');
    say('Karte ' + num + ': Vorhang auf.');
    return true;
  }

  async function unlock(numRaw, pwRaw, quiet) {
    const num = parseInt(String(numRaw).replace(/\D/g, ''), 10), pw = canon(pwRaw);
    if (!(num >= 1 && num <= 60)) { say('Die Nummer steht gross auf deiner Karte: eine Zahl von 1 bis 60.'); flick($('nbox'), 'dim'); n.focus(); return; }
    if (pw.length !== 6) { say('Das Passwort hat sechs Zeichen, zum Beispiel ABC 234.'); flick($('pbox'), 'dim'); p.focus(); return; }
    if (!window.crypto || !crypto.subtle) { say('Dieser Browser kann die Karte nicht prüfen. Öffne die Seite bitte in Safari oder Chrome.'); return; }
    go.disabled = true; go.textContent = 'Einen Moment …'; stage.classList.add('busy'); say('');
    const t0 = performance.now();
    let entry = null;
    try { entry = await open(num, pw); } catch (e) { entry = null; }
    const left = 700 - (performance.now() - t0); if (left > 0) await wait(left);
    stage.classList.remove('busy'); go.disabled = false; go.textContent = 'Vorhang auf';
    if (!entry) {
      if (!quiet) { say('Das passt nicht. Schau nochmal auf deine Karte.'); flick($('nbox'), 'dim'); flick($('pbox'), 'dim'); }
      try { localStorage.removeItem(STORE); } catch (e) {}
      return;
    }
    if (show(entry, num)) { try { localStorage.setItem(STORE, JSON.stringify({ n: num, p: pw })); } catch (e) {} }
  }

  f.addEventListener('submit', ev => { ev.preventDefault(); unlock(n.value, p.value, false); });
  n.addEventListener('input', () => { n.value = n.value.replace(/\D/g, '').slice(0, 2); flick(n, 'clack'); });
  $('again').addEventListener('click', () => {
    try { localStorage.removeItem(STORE); } catch (e) {}
    app.classList.remove('done'); stage.classList.remove('ready', 'cooking');
    $('files').href = '#'; $('making2').hidden = true; n.value = ''; p.value = ''; say(''); n.focus();
  });

  // a card that worked before on this phone opens straight away
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved && saved.n && saved.p) { n.value = saved.n; p.value = saved.p; unlock(saved.n, saved.p, true); }
  } catch (e) {}
})();
</script>
